[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-ai"
version = "0.1.0"
description = "Self-reviewing quant AI: data collection, regime/news/feature engines, prediction, backtest, paper/shadow/live trading and daily review"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "sqlalchemy>=2.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
ai = ["anthropic>=1.0"]
yahoo = ["yfinance>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
quant-ai = "quant_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_ai = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
