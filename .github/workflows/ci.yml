name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: quant, POSTGRES_PASSWORD: quant, POSTGRES_DB: quant }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quant" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev,postgres,ai]" alembic
      - run: ruff check src tests
      - name: 마이그레이션 (PostgreSQL)
        env: { DATABASE_URL: "postgresql://quant:quant@localhost:5432/quant" }
        run: alembic upgrade head && alembic check
      - run: pytest -q
      - name: 통합 테스트 (PostgreSQL)
        env: { QUANT_TEST_DATABASE_URL: "postgresql://quant:quant@localhost:5432/quant" }
        run: pytest -q tests/test_postgres.py
